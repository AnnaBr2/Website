<article class="anna-article-row">
  <a href="{{ .RelPermalink }}" class="anna-article-row-link">
    <div class="anna-row-meta"><span>{{ .Params.category }}</span>{{ if .Draft }}<span class="anna-draft-badge">Entwurf</span>{{ else }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>{{ end }}<span>{{ .ReadingTime }} Min. Lesezeit</span></div>
    <div class="anna-row-copy"><h3>{{ .Title }}</h3><p>{{ .Description }}</p></div>
    <span class="anna-row-arrow" aria-hidden="true">↗</span>
  </a>
</article>
