name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build Roxo styles
        run: |
          npm ci
          npm run css
      - name: Install pinned Hugo
        run: |
          set -euo pipefail
          HUGO_VERSION="$(tr -d '\r\n' < .hugo-version)"
          [[ "$HUGO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          RELEASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 "$RELEASE/$ARCHIVE" --output "$ARCHIVE"
          curl --fail --location --retry 3 "$RELEASE/hugo_${HUGO_VERSION}_checksums.txt" --output checksums.txt
          awk -v file="$ARCHIVE" '$2 == file { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$ARCHIVE" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${PAGES_BASE_URL}/" --destination public
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
